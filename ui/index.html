<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polaris-api</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body data-dbx-theme="light">
  <div id="app" class="pa-root">
    <!-- 顶栏 -->
    <header class="pa-topbar">
      <div class="pa-brand">
        <img id="brandIcon" src="" alt="" width="20" height="20" />
        <span class="pa-title">polaris-api</span>
        <span id="collectionName" class="pa-collection"></span>
      </div>
      <div class="pa-actions">
        <input id="search" class="pa-input pa-search" type="search" placeholder="搜索接口 / 路径 / 方法…" />
        <button id="btnImport" class="pa-btn pa-btn--primary" type="button">导入 OpenAPI / Postman</button>
        <button id="btnExportMd" class="pa-btn" type="button" title="导出当前接口为 Markdown">导出 MD</button>
      </div>
    </header>

    <!-- 导入面板 -->
    <section id="importPanel" class="pa-import" hidden>
      <div class="pa-import__inner">
        <h2>导入 API 定义</h2>
        <div class="pa-import__tabs">
          <button id="tabPaste" class="pa-tab" type="button">粘贴 JSON</button>
          <button id="tabFile" class="pa-tab" type="button">上传文件</button>
          <button id="tabUrl" class="pa-tab" type="button">从 URL 拉取</button>
        </div>

        <div id="panePaste" class="pa-pane">
          <textarea id="pasteInput" class="pa-textarea" placeholder="粘贴 OpenAPI (swagger/openapi) 或 Postman Collection v2.1 JSON…"></textarea>
        </div>
        <div id="paneFile" class="pa-pane" hidden>
          <input id="fileInput" class="pa-file" type="file" accept=".json,.yaml,.yml,.openapi.yaml,.postman_collection.json" />
          <p class="pa-hint">支持 .json；YAML 即将支持。文件需为合法 OpenAPI / Swagger / Postman v2.1。</p>
        </div>
        <div id="paneUrl" class="pa-pane" hidden>
          <input id="urlInput" class="pa-input" type="url" placeholder="https://example.com/openapi.json" />
          <p class="pa-hint">需要网络权限：dbx 沙箱默认禁用；请在插件上启用 host.network 目标域名后才可用。</p>
        </div>

        <div class="pa-import__foot">
          <button id="btnDoImport" class="pa-btn pa-btn--primary" type="button">开始导入</button>
          <button id="btnCancelImport" class="pa-btn" type="button">取消</button>
        </div>
      </div>
    </section>

    <!-- 主区：目录树 + 详情 -->
    <main class="pa-main">
      <aside class="pa-tree">
        <div class="pa-tree__head">
          <span id="treeTitle">目录</span>
          <span id="count" class="pa-count"></span>
        </div>
        <ul id="tree" class="pa-tree__list"></ul>
        <div id="emptyState" class="pa-empty">
          <p>还没有导入任何 API</p>
          <p class="pa-hint">点击「导入 OpenAPI / Postman」开始。</p>
        </div>
      </aside>

      <section id="detail" class="pa-detail" hidden>
        <!-- 由 detail.js 渲染 -->
      </section>
      <section id="welcome" class="pa-welcome">
        <img id="welcomeIcon" src="" alt="" width="48" height="48" />
        <h1>polaris-api</h1>
        <p>导入 OpenAPI / Swagger 或 Postman Collection，浏览、搜索、整理你的接口资产。</p>
      </section>
    </main>
  </div>

  <script>
    window.POLARIS_EXTERNAL = { dbxPlugin: null };
  </script>
  <script src="./importer.js"></script>
  <script src="./dbx-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
